 else if(a=='send'){const q=$('#ci').value.trim();if(q)ask(q)}});
document.addEventListener('change',e=>{const s=e.target;if(s.id=='rxf'&&s.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rxImg=c.toDataURL('image/jpeg',.85);scanned=null;route()};im.src=r.result};r.readAsDataURL(s.files[0]);return}if(s.dataset.doc&&s.files[0]){setPic(s.dataset.doc,s.files[0]);return}if(s.id=='sl'){if(+s.value>=97){S.taken[s.dataset.k]=1;const m=S.meds.find(m=>m.id==s.dataset.m);if(m&&m.left>0)m.left--;save();toast('Dose confirmed');route()}else s.value=0}});
document.addEventListener('input',e=>{const t=e.target,id=t.id;
 if(id=='md'){addf.dose=t.value;return}if(id=='mq'){addf.qty=t.value;return}
 if(id=='mn'||id=='ps'){if(id=='mn')addf.name=t.value;else pq=t.value;const pos=t.selectionStart;route();const el=$('#'+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){if(e.target.id=='ap')$('[data-a=login]').click();if(e.target.id=='ci')$('[data-a=send]').click();if(e.target.id=='ask')$('[data-a=ask]').click()}});
setInterval(()=>{const o=S.orders.at(-1),el=$('#steps');if(o&&el&&location.hash=='#shop'){const st=Math.min(3,Math.floor((Date.now()-o.at)/8000));[...el.children].forEach((c,i)=>c.classList.toggle('d',i<=st))}},2000);
addEventListener('hashchange',route);$('#v').classList.add('first');setTimeout(()=>$('#v').classList.remove('first'),1300);route();
</script>

if ("serviceWorker" in navigator) {
